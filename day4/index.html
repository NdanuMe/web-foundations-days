<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <h1>QuickNotes</h1>
  <label for="note-text">Your note:</label><br>
  <textarea id="note-text" rows="8" cols="50"></textarea>
  <p id="char-count">0 / 200 characters</p>
  <p id="word-count">0 words</p>
  <button type="button" id="clear-btn">Clear</button>
  <button type="button" id="theme-toggle">Dark mode</button>
</body>
</html>
